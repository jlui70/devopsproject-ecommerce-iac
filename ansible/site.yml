---
- name: Install dependency packages on all nodes
  hosts: control_plane:workers
  become: true
  roles:
    - dependency-packages

- name: Install and configure CRI-O container runtime
  hosts: control_plane:workers
  become: true
  roles:
    - container-runtime

- name: Install Kubernetes packages
  hosts: control_plane:workers
  become: true
  roles:
    - kube-packages

- name: Initialize Kubernetes cluster (first control plane)
  hosts: control_plane[0]
  become: true
  roles:
    - init-cluster

- name: Install Antrea CNI
  hosts: control_plane[0]
  become: true
  roles:
    - container-network

- name: Install Helm
  hosts: control_plane[0]
  become: true
  roles:
    - helm

- name: Install EBS CSI storage driver
  hosts: control_plane[0]
  become: true
  roles:
    - container-storage

- name: Join worker nodes to cluster
  hosts: workers
  become: true
  roles:
    - join-workers

- name: Join additional control plane nodes
  hosts: control_plane[1:]
  become: true
  roles:
    - join-control-planes

- name: Install AWS Cloud Controller Manager
  hosts: control_plane[0]
  become: true
  roles:
    - cloud-controller

- name: Install AWS Load Balancer Controller
  hosts: control_plane[0]
  become: true
  roles:
    - load-balancer-controller

- name: Install External DNS
  hosts: control_plane[0]
  become: true
  roles:
    - external-dns

- name: Install Cluster Autoscaler
  hosts: control_plane[0]
  become: true
  roles:
    - cluster-autoscaler

- name: Install Metrics Server
  hosts: control_plane[0]
  become: true
  roles:
    - metrics-server

- name: Install Node Termination Handler
  hosts: control_plane[0]
  become: true
  roles:
    - node-termination

- name: Install External Secrets Operator
  hosts: control_plane[0]
  become: true
  roles:
    - external-secrets-operator

- name: Install Fluent Bit log shipper
  hosts: control_plane[0]
  become: true
  tags: fluent-bit
  roles:
    - fluent-bit

- name: Install Metricbeat metrics shipper
  hosts: control_plane[0]
  become: true
  tags: metricbeat
  roles:
    - metricbeat

- name: Install KEDA event-driven autoscaler
  hosts: control_plane[0]
  become: true
  roles:
    - keda

- name: Install Argo Rollouts for Blue/Green deployments
  hosts: control_plane[0]
  become: true
  roles:
    - argo-rollouts

- name: Install ArgoCD, apply GitOps Application and create ECR pull secret
  hosts: control_plane[0]
  become: true
  roles:
    - argocd
