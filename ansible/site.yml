---
# tags: always nas 3 plays abaixo — achado ao vivo em 2026-08-17: um node worker
# novo (ASG escalado manualmente de 4 para 5) rodou so com `--tags join-workers`
# (atalho documentado desde 2026-08-10 para reexecutar so' o join apos falha
# transitoria) e falhou com "Could not find the requested service kubelet: host"
# — kubelet nunca tinha sido instalado nesse host, porque estas 3 plays nao tinham
# tag nenhuma e por isso sao puladas por QUALQUER filtro --tags, nao so' join-workers.
# Isso e' inofensivo em hosts ja provisionados (idempotente, nada muda) e
# obrigatorio em host novo — por isso `always`, nao uma tag especifica: garante
# que rodam sempre, seja o playbook completo ou qualquer execucao filtrada por
# tag (join-workers, ecr-secret-staging, fluent-bit, etc.), sem exigir que quem
# rodar o comando saiba adicionar essas 3 tags manualmente toda vez.
- name: Install dependency packages on all nodes
  hosts: control_plane:workers
  become: true
  tags: always
  roles:
    - dependency-packages

- name: Install and configure CRI-O container runtime
  hosts: control_plane:workers
  become: true
  tags: always
  roles:
    - container-runtime

- name: Install Kubernetes packages
  hosts: control_plane:workers
  become: true
  tags: always
  roles:
    - kube-packages

- name: Initialize Kubernetes cluster (first control plane)
  hosts: control_plane[0]
  become: true
  roles:
    - init-cluster

- name: Install Antrea CNI
  hosts: control_plane[0]
  become: true
  roles:
    - container-network

- name: Install Helm
  hosts: control_plane[0]
  become: true
  roles:
    - helm

- name: Install EBS CSI storage driver
  hosts: control_plane[0]
  become: true
  roles:
    - container-storage

- name: Join worker nodes to cluster
  hosts: workers
  become: true
  tags: join-workers
  roles:
    - join-workers

# 2026-08-10: tag adicionada apos falha transitoria ao vivo (worker_join_command
# undefined nos 4 workers, delegate_facts+loop do join-commands.yml na role
# init-cluster) — resolvida com um simples re-run do playbook completo (idempotente,
# hosts ja unidos sao pulados). O join do segundo control plane usa o MESMO padrao
# (delegate_facts+loop) e funcionou de primeira na mesma execucao, o que aponta pra
# um blip transitorio (SSM Agent dos workers ainda terminando de registrar no exato
# momento do loop) e nao um bug deterministico no mecanismo. A tag permite um retry
# rapido e cirurgico (`--tags join-workers`) se acontecer de novo, em vez de rodar o
# playbook inteiro (~25 min) so por causa disso.
- name: Join additional control plane nodes
  hosts: control_plane[1:]
  become: true
  tags: join-control-planes
  roles:
    - join-control-planes

- name: Install AWS Cloud Controller Manager
  hosts: control_plane[0]
  become: true
  roles:
    - cloud-controller

- name: Install AWS Load Balancer Controller
  hosts: control_plane[0]
  become: true
  roles:
    - load-balancer-controller

- name: Install External DNS
  hosts: control_plane[0]
  become: true
  roles:
    - external-dns

- name: Install Cluster Autoscaler
  hosts: control_plane[0]
  become: true
  tags: cluster-autoscaler
  roles:
    - cluster-autoscaler

- name: Install Metrics Server
  hosts: control_plane[0]
  become: true
  roles:
    - metrics-server

- name: Install Node Termination Handler
  hosts: control_plane[0]
  become: true
  roles:
    - node-termination

- name: Install Velero for automated cluster backup
  hosts: control_plane[0]
  become: true
  tags: velero
  roles:
    - velero

- name: Install External Secrets Operator
  hosts: control_plane[0]
  become: true
  roles:
    - external-secrets-operator

- name: Install Cert-Manager for automated TLS certificate lifecycle
  hosts: control_plane[0]
  become: true
  tags: cert-manager
  roles:
    - cert-manager

- name: Install Kyverno admission controller for policy governance
  hosts: control_plane[0]
  become: true
  tags: kyverno
  roles:
    - kyverno

- name: Install Fluent Bit log shipper
  hosts: control_plane[0]
  become: true
  tags: fluent-bit
  roles:
    - fluent-bit

- name: Install KEDA event-driven autoscaler
  hosts: control_plane[0]
  become: true
  roles:
    - keda

- name: Install kube-prometheus-stack (Prometheus, Grafana, Alertmanager, node-exporter)
  hosts: control_plane[0]
  become: true
  tags: kube-prometheus-stack
  roles:
    - kube-prometheus-stack

- name: Install Argo Rollouts for Blue/Green deployments
  hosts: control_plane[0]
  become: true
  roles:
    - argo-rollouts

- name: Install ArgoCD, apply GitOps Application and create ECR pull secret
  hosts: control_plane[0]
  become: true
  roles:
    - argocd
