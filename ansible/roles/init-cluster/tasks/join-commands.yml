---
- name: Wait for Kubernetes API server to be ready
  ansible.builtin.wait_for:
    port: 6443
    host: 127.0.0.1
    state: started
    timeout: 120
    delay: 10

- name: Wait for API server to be fully ready (healthz)
  ansible.builtin.command:
    cmd: "curl -sk https://127.0.0.1:6443/healthz"
  register: api_health
  retries: 18
  delay: 10
  until: api_health.stdout == 'ok'
  changed_when: false

- name: Generate worker join command
  ansible.builtin.command:
    cmd: "kubeadm token create --print-join-command --ttl 0"
  register: worker_join_command_output
  changed_when: true

- name: Upload cluster certificates for control plane join
  ansible.builtin.shell:
    cmd: "kubeadm init phase upload-certs --upload-certs 2>/dev/null | tail -1"
  register: certificate_key_output
  changed_when: true

- name: Generate control plane join command with certificate key
  ansible.builtin.command:
    cmd: "kubeadm token create --print-join-command --ttl 0 --certificate-key {{ certificate_key_output.stdout | trim }}"
  register: control_plane_join_command_raw
  changed_when: true

- name: Distribute worker join command to all hosts
  ansible.builtin.set_fact:
    worker_join_command: "{{ worker_join_command_output.stdout | trim }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['all'] }}"

- name: Distribute control plane join command to all hosts
  ansible.builtin.set_fact:
    control_plane_join_command: "{{ control_plane_join_command_raw.stdout | trim }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['all'] }}"
