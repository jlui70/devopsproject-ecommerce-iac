---
- name: Wait for Kubernetes API server to be ready
  ansible.builtin.wait_for:
    port: 6443
    host: 127.0.0.1
    state: started
    timeout: 120
    delay: 10

- name: Wait for API server to be fully ready (healthz)
  ansible.builtin.command:
    cmd: "curl -sk https://127.0.0.1:6443/healthz"
  register: api_health
  retries: 18
  delay: 10
  until: api_health.stdout == 'ok'
  changed_when: false

- name: Generate worker join command
  ansible.builtin.command:
    cmd: "kubeadm token create --print-join-command --ttl 0"
  register: worker_join_command_output
  changed_when: true

- name: Upload cluster certificates for control plane join
  ansible.builtin.shell:
    cmd: "kubeadm init phase upload-certs --upload-certs 2>/dev/null | tail -1"
  register: certificate_key_output
  changed_when: true

- name: Generate control plane join command with certificate key
  ansible.builtin.command:
    cmd: "kubeadm token create --print-join-command --ttl 0 --certificate-key {{ certificate_key_output.stdout | trim }}"
  register: control_plane_join_command_raw
  changed_when: true

- name: Distribute worker join command to all hosts
  ansible.builtin.set_fact:
    worker_join_command: "{{ worker_join_command_output.stdout | trim }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['all'] }}"

- name: Distribute control plane join command to all hosts
  ansible.builtin.set_fact:
    control_plane_join_command: "{{ control_plane_join_command_raw.stdout | trim }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['all'] }}"

# ADR-0022 — grava o comando de join atual no SSM Parameter Store a cada execucao
# (tag always, roda toda vez que o playbook executa, mesmo filtrado). O user_data
# dos workers (terraform/server/ec2.instances.worker-bootstrap.tf) le este
# parametro no boot para se auto-unir ao cluster sem depender de reexecucao manual
# do Ansible — cobre scale-up do Cluster Autoscaler ou ajuste manual do ASG feito
# DEPOIS que o cluster ja existe (nao cobre o bootstrap inicial, que continua via
# Ansible completo). IAM: ssm:PutParameter concedido so' ao control plane
# (iam.control-plane.tf, statement WorkerJoinCommandWrite) — workers ja tem
# ssm:GetParameter via AmazonSSMManagedInstanceCore, sem IAM adicional.
- name: Store worker join command in SSM Parameter Store (ADR-0022)
  ansible.builtin.command:
    cmd: >
      aws ssm put-parameter
      --name /devopsproject/cluster/worker-join-command
      --value "{{ worker_join_command_output.stdout | trim }}"
      --type SecureString
      --overwrite
      --region us-east-1
  changed_when: true
  no_log: true
