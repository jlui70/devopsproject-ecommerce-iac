---
- name: Add EKS Helm chart repository (idempotent)
  ansible.builtin.command:
    cmd: "helm repo add eks https://aws.github.io/eks-charts"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: "helm repo update"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Install or upgrade AWS Node Termination Handler via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install aws-node-termination-handler eks/aws-node-termination-handler
      --namespace kube-system
      --set enableSqsTerminationDraining=true
      --set queueURL={{ node_termination_queue_url }}
      --set awsRegion=us-east-1
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for Node Termination Handler pods to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod
      --namespace kube-system
      --selector=app.kubernetes.io/name=aws-node-termination-handler
      --for=condition=Ready
      --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
