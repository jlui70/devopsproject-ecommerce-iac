---
- name: Add EKS Helm chart repository
  ansible.builtin.command:
    cmd: "helm repo add eks https://aws.github.io/eks-charts"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: "helm repo update"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Install or upgrade AWS Load Balancer Controller via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller --version {{ load_balancer_controller_chart_version }}
      --namespace kube-system
      --set clusterName={{ cluster_name }}
      --set serviceAccount.create=true
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for AWS Load Balancer Controller to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod
      --namespace kube-system
      --selector=app.kubernetes.io/name=aws-load-balancer-controller
      --for=condition=Ready
      --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Wait for LBC webhook certificate to be provisioned by certgen
  ansible.builtin.pause:
    seconds: 30
