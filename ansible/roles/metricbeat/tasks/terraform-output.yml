---
- name: Download observability Terraform state from S3
  ansible.builtin.command:
    cmd: "aws s3 cp s3://{{ terraform_state_bucket }}/observability/terraform.tfstate /tmp/terraform-observability.tfstate"
  changed_when: true

- name: Read opensearch_domain_endpoint from Terraform state
  ansible.builtin.shell:
    cmd: "python3 -c \"import json; s=json.load(open('/tmp/terraform-observability.tfstate')); print(s['outputs']['opensearch_domain_endpoint']['value'])\""
  register: opensearch_endpoint_output
  changed_when: false

- name: Set OpenSearch facts for all hosts
  ansible.builtin.set_fact:
    opensearch_endpoint: "{{ opensearch_endpoint_output.stdout | trim }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['all'] }}"
