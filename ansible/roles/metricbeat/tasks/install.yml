---
- name: Add Elastic Helm repository
  ansible.builtin.command:
    cmd: "helm repo add elastic https://helm.elastic.co"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: "helm repo update"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Create observability namespace
  ansible.builtin.shell:
    cmd: "kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Create opensearch-credentials secret
  ansible.builtin.shell:
    cmd: >
      kubectl create secret generic opensearch-credentials
      --namespace observability
      --from-literal=username=admin
      --from-literal=password={{ opensearch_master_password }}
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true
  no_log: true

- name: Render Metricbeat values file
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /tmp/metricbeat-values.yaml
    mode: "0600"

- name: Install or upgrade Metricbeat via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install metricbeat elastic/metricbeat
      --version 7.17.3
      --namespace observability
      --values /tmp/metricbeat-values.yaml
      --timeout 300s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true
