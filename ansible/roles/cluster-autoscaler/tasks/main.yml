---
- name: Add Kubernetes autoscaler Helm chart repository
  ansible.builtin.command:
    cmd: "helm repo add autoscaler https://kubernetes.github.io/autoscaler"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: "helm repo update"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

# ConfigMap deve existir ANTES do helm upgrade — sem ele o priority-expander não sobe
- name: Copy priority-expander ConfigMap to remote
  ansible.builtin.copy:
    src: "{{ role_path }}/templates/priority-expander-configmap.yaml"
    dest: /tmp/ca-priority-expander-configmap.yaml
    mode: "0600"

- name: Apply cluster-autoscaler priority-expander ConfigMap
  ansible.builtin.shell:
    cmd: "kubectl apply -f /tmp/ca-priority-expander-configmap.yaml"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Install or upgrade Cluster Autoscaler via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install cluster-autoscaler autoscaler/cluster-autoscaler
      --version {{ cluster_autoscaler_chart_version }}
      --namespace kube-system
      --set autoDiscovery.clusterName={{ cluster_name }}
      --set awsRegion=us-east-1
      --set image.tag=v1.30.0
      --set extraArgs.expander=priority
      --set extraArgs.scale-down-utilization-threshold=0.5
      --set extraArgs.scale-down-unneeded-time=10m
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for Cluster Autoscaler pod to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod
      --namespace kube-system
      --selector=app.kubernetes.io/name=aws-cluster-autoscaler
      --for=condition=Ready
      --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Copy overprovisioning resources to remote
  ansible.builtin.copy:
    src: "{{ role_path }}/templates/overprovisioning.yaml"
    dest: /tmp/ca-overprovisioning.yaml
    mode: "0600"

- name: Apply overprovisioning PriorityClass and Deployment
  ansible.builtin.shell:
    cmd: "kubectl apply -f /tmp/ca-overprovisioning.yaml"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true
