---
- name: Add external-dns Helm repository (kubernetes-sigs official)
  ansible.builtin.command:
    cmd: "helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: "helm repo update"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Check if external-dns is already installed
  ansible.builtin.command:
    cmd: "helm status external-dns --namespace kube-system"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: external_dns_status
  changed_when: false
  failed_when: false

- name: Install or upgrade External DNS via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install external-dns external-dns/external-dns
      --version {{ external_dns_chart_version }}
      --namespace kube-system
      --set provider.name=aws
      --set env[0].name=AWS_DEFAULT_REGION
      --set env[0].value=us-east-1
      --set txtOwnerId={{ cluster_name }}
      --set domainFilters[0]=ecommerce-devopsproject.com
      --set policy=upsert-only
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true
  failed_when: false
  when: external_dns_status.rc != 0

- name: Wait for External DNS pod to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod
      --namespace kube-system
      --selector=app.kubernetes.io/name=external-dns
      --for=condition=Ready
      --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
