# PrometheusRule — Event-Driven Autoscaling alerts
# ADR-0007: alertas para KEDA, SQS e ScaledObject health
# Namespace: monitoring
# Requires: monitoring.coreos.com/v1 CRD (installed by kube-prometheus-stack)
# Selected by Prometheus via label release: kube-prometheus-stack
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: event-driven-autoscaling
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: event-driven-autoscaling
      interval: 30s
      rules:
        # 1. DLQ não vazia — usa keda_scaler_metrics_value como proxy enquanto yace/CloudWatch
        #    exporter não estiver disponível. keda_scaler_metrics_value representa a
        #    profundidade da fila principal lida pelo KEDA; quando > 0 após múltiplos ciclos
        #    indica possível retenção/DLQ. Substituir pela métrica real da DLQ quando yace
        #    for adicionado (ApproximateNumberOfMessagesNotVisible ou DLQ depth via CloudWatch).
        - alert: SQSDLQNotEmpty
          expr: |
            sum by (scaledObject, namespace) (
              keda_scaler_metrics_value{scaler="aws-sqs-queue"}
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Fila SQS com mensagens acumuladas por mais de 5min"
            description: >-
              ScaledObject {{ $labels.scaledObject }} (namespace {{ $labels.namespace }})
              tem {{ $value }} mensagens na fila há mais de 5 minutos.
              Verificar se consumidores estão ativos e se há mensagens na DLQ.

        # 2. Réplicas saturadas no máximo — indica necessidade de aumento do maxReplicaCount
        #    ou investigação de gargalo nos consumers.
        #    keda_hpa_max_replicas: valor máximo configurado no ScaledObject/HPA gerenciado pelo KEDA.
        #    keda_scaler_active: 1 quando o ScaledObject está ativo e escalando.
        - alert: KEDAReplicasAtMax
          expr: |
            keda_resource_totals{resource="hpa"}
              >= on(scaledObject, namespace) group_left()
            keda_hpa_max_replicas
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Réplicas saturadas no máximo por 5min"
            description: >-
              ScaledObject {{ $labels.scaledObject }} (namespace {{ $labels.namespace }})
              está no maxReplicaCount há mais de 5 minutos.
              Revisar capacidade máxima ou investigar gargalo no processamento.

        # 3. ScaledObject com erros de scaler — indica falha ao ler a fila (IAM, URL inválida,
        #    rede). keda_scaler_errors_total acumula erros; rate > 0 por 2min indica falha ativa.
        - alert: KEDAScaledObjectNotReady
          expr: |
            rate(keda_scaler_errors_total[2m]) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ScaledObject com erros de scaler (possível falha IAM ou queueURL)"
            description: >-
              ScaledObject {{ $labels.scaledObject }} (namespace {{ $labels.namespace }},
              scaler {{ $labels.scaler }}) está acumulando erros de leitura da fila.
              Causas prováveis: permissão IAM insuficiente, queueURL incorreta, ou
              falha de rede para o endpoint SQS.

        # 4. KEDA operator sem scrape — alerta se as métricas do operador KEDA pararem
        #    de chegar ao Prometheus (pod crashed, rede, etc).
        - alert: KEDAOperatorMetricsMissing
          expr: |
            absent(keda_scaler_metrics_value)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Métricas do KEDA operator ausentes no Prometheus"
            description: >-
              A métrica keda_scaler_metrics_value não está sendo coletada há mais de 5 minutos.
              Verificar se o pod keda-operator está Running e se o job 'keda-operator'
              aparece nos targets do Prometheus (Status → Targets).
