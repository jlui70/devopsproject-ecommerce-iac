---
# ADR-0023 — a senha do Grafana vem do SSM Parameter Store (SecureString), semeada
# uma vez no Estagio 0 do RUNBOOK. Antes era obrigatorio passar
# `-e grafana_admin_password="..."` em TODA execucao do playbook, o que colocava a
# senha em texto puro no runbook, no historico do shell e na saida de `ps`.
# A leitura so' acontece quando a variavel nao foi definida de outra forma, entao um
# `-e grafana_admin_password=...` continua funcionando como sobreposicao pontual.
- name: Read Grafana admin password from SSM Parameter Store
  ansible.builtin.command:
    cmd: >
      aws ssm get-parameter
      --name {{ grafana_admin_password_ssm_parameter }}
      --with-decryption
      --query Parameter.Value
      --output text
      --region {{ terraform_state_region }}
  register: grafana_password_output
  changed_when: false
  failed_when: false
  no_log: true
  when: grafana_admin_password is not defined

- name: Set grafana_admin_password from SSM
  ansible.builtin.set_fact:
    grafana_admin_password: "{{ grafana_password_output.stdout | trim }}"
  no_log: true
  when:
    - grafana_admin_password is not defined
    - grafana_password_output.rc | default(1) == 0
    - (grafana_password_output.stdout | default('') | trim) | length > 0

- name: Fail if the Grafana admin password is unavailable
  ansible.builtin.fail:
    msg: >-
      Senha do Grafana indisponivel: o parametro SSM
      {{ grafana_admin_password_ssm_parameter }} nao existe ou esta vazio, e
      grafana_admin_password nao foi passada com -e. Semeie o parametro (Estagio 0
      do RUNBOOK, ADR-0023):
      aws ssm put-parameter --name {{ grafana_admin_password_ssm_parameter }}
      --type SecureString --value '<senha>' --region {{ terraform_state_region }}
  when: grafana_admin_password is not defined

- name: Add Prometheus community Helm repository
  ansible.builtin.command:
    cmd: "helm repo add prometheus-community https://prometheus-community.github.io/helm-charts"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: "helm repo update"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Create monitoring namespace
  ansible.builtin.shell:
    cmd: "kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Clean kube-prometheus-stack Helm installation state
  ansible.builtin.shell: |
    NS_STATUS=$(kubectl get namespace monitoring -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
    if [ "$NS_STATUS" = "Active" ]; then
      kubectl get secrets -n monitoring -l "owner=helm,name=kube-prometheus-stack" \
        --no-headers -o custom-columns="NAME:.metadata.name,STATUS:.metadata.labels.status" \
        2>/dev/null | grep -v "deployed" | awk '{print $1}' | \
        xargs -r kubectl delete secret -n monitoring 2>/dev/null || true
    fi
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Render kube-prometheus-stack values file
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /tmp/kube-prometheus-stack-values.yaml
    mode: "0600"

- name: Install or upgrade kube-prometheus-stack via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack
      --namespace monitoring
      --version {{ prometheus_stack_chart_version }}
      --values /tmp/kube-prometheus-stack-values.yaml
      --timeout 600s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for Prometheus pod to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod
      --namespace monitoring
      --selector=app.kubernetes.io/name=prometheus
      --for=condition=Ready
      --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Wait for Grafana pod to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod
      --namespace monitoring
      --selector=app.kubernetes.io/name=grafana
      --for=condition=Ready
      --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
