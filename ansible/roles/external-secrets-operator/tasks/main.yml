---
- name: Add External Secrets Operator Helm repository
  ansible.builtin.command:
    cmd: "helm repo add external-secrets https://charts.external-secrets.io"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: "helm repo update"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Install or upgrade External Secrets Operator via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install external-secrets external-secrets/external-secrets
      --namespace external-secrets
      --create-namespace
      --set installCRDs=true
      --timeout 300s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for External Secrets Operator to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod
      --namespace external-secrets
      --selector=app.kubernetes.io/name=external-secrets
      --for=condition=Ready
      --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
