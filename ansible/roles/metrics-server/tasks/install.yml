---
- name: Apply Metrics Server official manifest
  ansible.builtin.command:
    cmd: "kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Check if metrics-server already has kubelet-insecure-tls
  ansible.builtin.command:
    cmd: "kubectl get deployment metrics-server -n kube-system -o jsonpath={.spec.template.spec.containers[0].args}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: ms_current_args
  changed_when: false
  failed_when: false

- name: Patch Metrics Server to skip kubelet TLS verification (required for kubeadm)
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - deployment
      - metrics-server
      - -n
      - kube-system
      - --type=json
      - '-p=[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true
  when: "'kubelet-insecure-tls' not in ms_current_args.stdout"
