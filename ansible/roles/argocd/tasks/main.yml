---
# ── Instalação do ArgoCD via Helm ───────────────────────────────────────────
- name: Add Argo Helm repository
  ansible.builtin.command:
    cmd: "helm repo add argo https://argoproj.github.io/argo-helm"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: "helm repo update"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Create argocd namespace
  ansible.builtin.shell:
    cmd: "kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Clean ArgoCD Helm installation state
  ansible.builtin.shell: |
    NS_STATUS=$(kubectl get namespace argocd -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
    if [ "$NS_STATUS" = "Terminating" ]; then
      kubectl get namespace argocd -o json | \
        python3 -c "import sys,json; d=json.load(sys.stdin); d['spec']['finalizers']=[]; print(json.dumps(d))" | \
        kubectl replace --raw /api/v1/namespaces/argocd/finalize -f - 2>/dev/null || true
      kubectl rollout restart deployment/antrea-controller -n kube-system 2>/dev/null || true
      kubectl wait --for=delete namespace/argocd --timeout=60s 2>/dev/null || true
    elif [ "$NS_STATUS" = "Active" ]; then
      kubectl get secrets -n argocd -l "owner=helm,name=argocd" \
        --no-headers -o custom-columns="NAME:.metadata.name,STATUS:.metadata.labels.status" \
        2>/dev/null | grep -v "deployed" | awk '{print $1}' | \
        xargs -r kubectl delete secret -n argocd 2>/dev/null || true
    fi
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Install or upgrade ArgoCD via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install argocd argo/argo-cd
      --namespace argocd
      --timeout 300s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for ArgoCD server to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod
      --namespace argocd
      --selector=app.kubernetes.io/name=argocd-server
      --for=condition=Ready
      --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

# ── Patch do ConfigMap para habilitar Helm no Kustomize ─────────────────────
- name: Render ArgoCD CM patch
  ansible.builtin.template:
    src: argocd-cm-patch.yml.j2
    dest: /tmp/argocd-cm-patch.yml
    mode: "0600"

- name: Apply ArgoCD CM patch (enable --enable-helm in kustomize)
  ansible.builtin.command:
    cmd: "kubectl apply -f /tmp/argocd-cm-patch.yml"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Restart ArgoCD repo-server to apply CM patch
  ansible.builtin.command:
    cmd: "kubectl rollout restart deployment argocd-repo-server -n argocd"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for ArgoCD repo-server rollout
  ansible.builtin.command:
    cmd: "kubectl rollout status deployment argocd-repo-server -n argocd --timeout=120s"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

# ── Aplicar ArgoCD Application (sincroniza GitOps com cluster) ───────────────
- name: Render ArgoCD Application manifest
  ansible.builtin.template:
    src: application.yml.j2
    dest: /tmp/argocd-application.yml
    mode: "0600"

- name: Apply ArgoCD Application
  ansible.builtin.command:
    cmd: "kubectl apply -f /tmp/argocd-application.yml"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

# ── ECR Image Pull Secret (aguarda namespace dpe criado pelo ArgoCD) ─────────
# ATENÇÃO: `failed_when: false` foi removido de propósito (2026-08-10). Com ele, esta
# task esgotava as 8 tentativas (2 min) sem o namespace existir e ainda assim reportava
# "ok" — mascarando o problema real (ex.: erro de sync do ArgoCD, como um kustomize
# apontando para um diretório que não existe no repo) até a task seguinte falhar sem
# contexto nenhum. Deixar falhar de verdade aqui dá um erro acionável na hora certa.
- name: Wait for dpe namespace to be created by ArgoCD
  ansible.builtin.command:
    cmd: "kubectl wait namespace dpe --for=jsonpath={.status.phase}=Active --timeout=45s"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  register: dpe_ns_wait
  retries: 8
  delay: 15
  until: dpe_ns_wait.rc == 0

- name: Verify dpe namespace exists before creating ECR secret
  ansible.builtin.command:
    cmd: "kubectl get namespace dpe"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Get ECR login token
  ansible.builtin.command:
    cmd: "aws ecr get-login-password --region us-east-1"
  register: ecr_token_output
  changed_when: false
  no_log: true

- name: Create ECR image pull secret in dpe namespace
  ansible.builtin.shell:
    cmd: >
      kubectl create secret docker-registry {{ ecr_pull_secret_name }}
      --docker-server={{ ecr_registry }}
      --docker-username=AWS
      --docker-password="{{ ecr_token_output.stdout }}"
      --namespace dpe
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true
  no_log: true

- name: Annotate ECR secret to prevent ArgoCD pruning
  ansible.builtin.command:
    cmd: >
      kubectl annotate secret {{ ecr_pull_secret_name }}
      --namespace dpe
      argocd.argoproj.io/sync-options=Prune=false
      --overwrite
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true
