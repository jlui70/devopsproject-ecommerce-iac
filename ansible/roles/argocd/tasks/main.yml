---
# ── Instalação do ArgoCD via Helm ───────────────────────────────────────────
- name: Add Argo Helm repository
  ansible.builtin.command:
    cmd: "helm repo add argo https://argoproj.github.io/argo-helm"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: "helm repo update"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Create argocd namespace
  ansible.builtin.shell:
    cmd: "kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Clean ArgoCD Helm installation state
  ansible.builtin.shell: |
    NS_STATUS=$(kubectl get namespace argocd -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
    if [ "$NS_STATUS" = "Terminating" ]; then
      kubectl get namespace argocd -o json | \
        python3 -c "import sys,json; d=json.load(sys.stdin); d['spec']['finalizers']=[]; print(json.dumps(d))" | \
        kubectl replace --raw /api/v1/namespaces/argocd/finalize -f - 2>/dev/null || true
      kubectl rollout restart deployment/antrea-controller -n kube-system 2>/dev/null || true
      kubectl wait --for=delete namespace/argocd --timeout=60s 2>/dev/null || true
    elif [ "$NS_STATUS" = "Active" ]; then
      kubectl get secrets -n argocd -l "owner=helm,name=argocd" \
        --no-headers -o custom-columns="NAME:.metadata.name,STATUS:.metadata.labels.status" \
        2>/dev/null | grep -v "deployed" | awk '{print $1}' | \
        xargs -r kubectl delete secret -n argocd 2>/dev/null || true
    fi
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Install or upgrade ArgoCD via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install argocd argo/argo-cd --version {{ argocd_chart_version }}
      --namespace argocd
      --timeout 300s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for ArgoCD server to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod
      --namespace argocd
      --selector=app.kubernetes.io/name=argocd-server
      --for=condition=Ready
      --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

# ── Patch do ConfigMap para habilitar Helm no Kustomize ─────────────────────
- name: Render ArgoCD CM patch
  ansible.builtin.template:
    src: argocd-cm-patch.yml.j2
    dest: /tmp/argocd-cm-patch.yml
    mode: "0600"

- name: Apply ArgoCD CM patch (enable --enable-helm in kustomize)
  ansible.builtin.command:
    cmd: "kubectl apply -f /tmp/argocd-cm-patch.yml"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Restart ArgoCD repo-server to apply CM patch
  ansible.builtin.command:
    cmd: "kubectl rollout restart deployment argocd-repo-server -n argocd"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for ArgoCD repo-server rollout
  ansible.builtin.command:
    cmd: "kubectl rollout status deployment argocd-repo-server -n argocd --timeout=120s"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

# ── Aplicar ArgoCD Application (sincroniza GitOps com cluster) ───────────────
- name: Render ArgoCD Application manifest
  ansible.builtin.template:
    src: application.yml.j2
    dest: /tmp/argocd-application.yml
    mode: "0600"

- name: Apply ArgoCD Application
  ansible.builtin.command:
    cmd: "kubectl apply -f /tmp/argocd-application.yml"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

# ── Aplicar ArgoCD Application de staging (ADR-0011/0013, ADR-0023) ──────────
# Antes do ADR-0023 este apply era um passo manual do runbook depois do Ansible.
# Aplicado aqui, o namespace `staging` passa a existir nesta mesma execucao, o que
# faz o guard do pull secret de staging (mais abaixo) encontrar o namespace e
# elimina a necessidade de reexecutar o playbook com `--tags ecr-secret-staging`.
- name: Render ArgoCD staging Application manifest
  ansible.builtin.template:
    src: application-staging.yml.j2
    dest: /tmp/argocd-application-staging.yml
    mode: "0600"
  when: staging_enabled | bool
  tags: ecr-secret-staging

- name: Apply ArgoCD staging Application
  ansible.builtin.command:
    cmd: "kubectl apply -f /tmp/argocd-application-staging.yml"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true
  when: staging_enabled | bool
  tags: ecr-secret-staging

# ── ECR Image Pull Secret (aguarda namespace dpe criado pelo ArgoCD) ─────────
# ATENÇÃO: `failed_when: false` foi removido de propósito (2026-08-10). Com ele, esta
# task esgotava as 8 tentativas (2 min) sem o namespace existir e ainda assim reportava
# "ok" — mascarando o problema real (ex.: erro de sync do ArgoCD, como um kustomize
# apontando para um diretório que não existe no repo) até a task seguinte falhar sem
# contexto nenhum. Deixar falhar de verdade aqui dá um erro acionável na hora certa.
- name: Wait for dpe namespace to be created by ArgoCD
  ansible.builtin.command:
    cmd: "kubectl wait namespace dpe --for=jsonpath={.status.phase}=Active --timeout=45s"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  register: dpe_ns_wait
  retries: 8
  delay: 15
  until: dpe_ns_wait.rc == 0

- name: Verify dpe namespace exists before creating ECR secret
  ansible.builtin.command:
    cmd: "kubectl get namespace dpe"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Get ECR login token
  ansible.builtin.command:
    cmd: "aws ecr get-login-password --region us-east-1"
  register: ecr_token_output
  changed_when: false
  no_log: true
  # Precisa da tag ecr-secret-staging tambem: e' pre-requisito da task "Create ECR
  # image pull secret in staging namespace" mais abaixo. Sem esta tag aqui, rodar o
  # playbook com --tags ecr-secret-staging pula esta task, ecr_token_output fica
  # indefinida, e a task de staging falha com erro mascarado por no_log: true
  # (achado ao vivo em 2026-08-17). Nao afeta o fluxo normal (sem --tags): tasks sem
  # filtro sempre rodam, independente das tags declaradas.
  tags: ecr-secret-staging

- name: Create ECR image pull secret in dpe namespace
  ansible.builtin.shell:
    cmd: >
      kubectl create secret docker-registry {{ ecr_pull_secret_name }}
      --docker-server={{ ecr_registry }}
      --docker-username=AWS
      --docker-password="{{ ecr_token_output.stdout }}"
      --namespace dpe
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true
  no_log: true

- name: Annotate ECR secret to prevent ArgoCD pruning
  ansible.builtin.command:
    cmd: >
      kubectl annotate secret {{ ecr_pull_secret_name }}
      --namespace dpe
      argocd.argoproj.io/sync-options=Prune=false
      --overwrite
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

# CORRIGIDO (achado ao vivo no deploy do zero de 2026-08-12, Fase 11): o pull secret
# de ECR nunca era criado no namespace `staging` — só existia no `dpe` (bloco acima).
# Resultado: todos os pods de staging ficavam em ImagePullBackOff/ErrImagePull com
# "authentication required", mesmo com a tag de imagem correta.
#
# ADR-0023: o namespace `staging` agora e' criado nesta mesma execucao, pelo apply da
# Application de staging mais acima — nao ha mais o caso "namespace ainda nao existe"
# quando staging_enabled=true. O guard permanece para cobrir staging_enabled=false
# (ambiente so' de producao), e nesse caso o skip e' legitimo. Se staging_enabled=true
# e o namespace mesmo assim nao existir, e' falha de sync do ArgoCD e o playbook para
# aqui, em vez de seguir e deixar os pods de staging em ImagePullBackOff.
# Espera de verdade, com retries: o namespace e' criado pelo ArgoCD
# (CreateNamespace=true) logo apos o apply da Application de staging, alguns passos
# acima — sem esperar, este guard corre antes do namespace aparecer e o pull secret
# volta a ser pulado, exatamente a falha que o ADR-0023 esta eliminando.
#
# Fica DEPOIS do caminho de producao (dpe) de proposito: se o sync de staging estiver
# quebrado mas o de producao estiver saudavel, o playbook chega ate aqui e falha com
# um erro especifico de staging, em vez de parar antes e dar a impressao de que o
# problema e' geral.
- name: Wait for the staging namespace to be created by ArgoCD
  ansible.builtin.command:
    cmd: "kubectl get namespace staging"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: staging_ns_check
  changed_when: false
  failed_when: false
  retries: "{{ 8 if (staging_enabled | bool) else 1 }}"
  delay: 15
  until: staging_ns_check.rc == 0 or not (staging_enabled | bool)
  tags: ecr-secret-staging

- name: Skip ECR pull secret for staging (staging desabilitado)
  ansible.builtin.debug:
    msg: "staging_enabled=false — ambiente de staging nao faz parte deste deploy, pull secret nao e' necessario."
  when: not (staging_enabled | bool)
  tags: ecr-secret-staging

- name: Fail if staging namespace is missing while staging is enabled
  ansible.builtin.fail:
    msg: >-
      staging_enabled=true, mas o namespace `staging` nao existe depois do apply da
      Application do ArgoCD. Isso indica falha de sync (ex.: `kustomize build staging`
      quebrado no repo GitOps, ou o repo inacessivel). Diagnostico:
      `kubectl -n argocd get application devopsproject-ecommerce-staging -o yaml`.
  when:
    - staging_enabled | bool
    - staging_ns_check.rc != 0
  tags: ecr-secret-staging

- name: Create ECR image pull secret in staging namespace
  ansible.builtin.shell:
    cmd: >
      kubectl create secret docker-registry {{ ecr_pull_secret_name_staging }}
      --docker-server={{ ecr_registry }}
      --docker-username=AWS
      --docker-password="{{ ecr_token_output.stdout }}"
      --namespace staging
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  when:
    - staging_enabled | bool
    - staging_ns_check.rc == 0
  changed_when: true
  no_log: true
  tags: ecr-secret-staging

- name: Annotate staging ECR secret to prevent ArgoCD pruning
  ansible.builtin.command:
    cmd: >
      kubectl annotate secret {{ ecr_pull_secret_name_staging }}
      --namespace staging
      argocd.argoproj.io/sync-options=Prune=false
      --overwrite
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  when:
    - staging_enabled | bool
    - staging_ns_check.rc == 0
  changed_when: true
  tags: ecr-secret-staging
