---
# ADR-0023 — esta role depende da stack Terraform `observability`, que passou a ser
# aplicada no Estagio 2, ANTES do Ansible (Estagio 4). Ate o ADR-0023 a ordem era a
# inversa (Ansible na Fase 5, observability na Fase 8) e esta role fazia um skip
# silencioso, imprimindo um `debug` dizendo que seria instalada "quando o playbook
# for reexecutado" — era exatamente esse skip que criava a antiga Fase 8.4
# (`ansible-playbook site.yml --tags fluent-bit`), o retrocesso que o ADR-0023
# elimina. Agora o pre-requisito e' obrigatorio e a ausencia falha alto: um skip
# silencioso aqui significa cluster sem envio de logs, sem ninguem perceber.
- name: Check if observability state has a valid opensearch_domain_endpoint output
  ansible.builtin.shell:
    cmd: |
      aws s3 cp s3://{{ terraform_state_bucket }}/observability/terraform.tfstate /tmp/terraform-observability.tfstate 2>/dev/null && \
      python3 -c "
      import json, sys
      s = json.load(open('/tmp/terraform-observability.tfstate'))
      v = s.get('outputs', {}).get('opensearch_domain_endpoint', {}).get('value')
      sys.exit(0 if v else 1)
      "
  register: observability_state
  changed_when: false
  failed_when: false

- name: Fail if the observability stack has not been applied yet
  ansible.builtin.fail:
    msg: >-
      A stack Terraform `observability` nao foi aplicada (output
      opensearch_domain_endpoint ausente em
      s3://{{ terraform_state_bucket }}/observability/terraform.tfstate).
      Ela faz parte do Estagio 2 do RUNBOOK e precisa estar aplicada antes deste
      playbook (Estagio 4) — ver ADR-0023. Aplique com:
      terraform -chdir=terraform/observability apply -var-file=envs/production.tfvars
  when: observability_state.rc != 0

- name: Retrieve OpenSearch outputs from Terraform state
  ansible.builtin.include_tasks: terraform-output.yml

- name: Install Fluent Bit via Helm
  ansible.builtin.include_tasks: install.yml
