---
- name: Add Cert-Manager Helm repository
  ansible.builtin.command:
    cmd: helm repo add jetstack https://charts.jetstack.io
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: helm repo update
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Install or upgrade Cert-Manager via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install cert-manager jetstack/cert-manager
      --namespace cert-manager
      --create-namespace
      --version {{ cert_manager_chart_version }}
      --set crds.enabled=true
      --timeout 300s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for Cert-Manager webhook to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod --namespace cert-manager
      --selector=app.kubernetes.io/component=webhook
      --for=condition=Ready --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Copy ClusterIssuers manifest to remote
  ansible.builtin.copy:
    src: "{{ role_path }}/templates/cluster-issuers.yaml"
    dest: /tmp/cert-manager-cluster-issuers.yaml
    mode: "0600"

- name: Apply SelfSigned ClusterIssuer, CA Certificate and CA ClusterIssuer
  ansible.builtin.shell:
    cmd: kubectl apply -f /tmp/cert-manager-cluster-issuers.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for CA Certificate to be ready
  ansible.builtin.command:
    cmd: >
      kubectl wait certificate dpe-ca --namespace cert-manager
      --for=condition=Ready --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
