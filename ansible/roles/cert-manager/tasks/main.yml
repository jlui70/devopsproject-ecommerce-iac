---
- name: Add Cert-Manager Helm repository
  ansible.builtin.command:
    cmd: helm repo add jetstack https://charts.jetstack.io
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: helm repo update
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Clean Cert-Manager Helm installation state
  ansible.builtin.shell: |
    NS_STATUS=$(kubectl get namespace cert-manager -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
    if [ "$NS_STATUS" = "Terminating" ]; then
      kubectl get namespace cert-manager -o json | \
        python3 -c "import sys,json; d=json.load(sys.stdin); d['spec']['finalizers']=[]; print(json.dumps(d))" | \
        kubectl replace --raw /api/v1/namespaces/cert-manager/finalize -f - 2>/dev/null || true
      kubectl rollout restart deployment/antrea-controller -n kube-system 2>/dev/null || true
      kubectl wait --for=delete namespace/cert-manager --timeout=60s 2>/dev/null || true
    elif [ "$NS_STATUS" = "Active" ]; then
      kubectl get secrets -n cert-manager -l "owner=helm,name=cert-manager" \
        --no-headers -o custom-columns="NAME:.metadata.name,STATUS:.metadata.labels.status" \
        2>/dev/null | grep -v "deployed" | awk '{print $1}' | \
        xargs -r kubectl delete secret -n cert-manager 2>/dev/null || true
    fi
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Install or upgrade Cert-Manager via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install cert-manager jetstack/cert-manager
      --namespace cert-manager
      --create-namespace
      --version {{ cert_manager_chart_version }}
      --set crds.enabled=true
      --timeout 300s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for Cert-Manager webhook to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod --namespace cert-manager
      --selector=app.kubernetes.io/component=webhook
      --for=condition=Ready --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Copy ClusterIssuers manifest to remote
  ansible.builtin.copy:
    src: "{{ role_path }}/templates/cluster-issuers.yaml"
    dest: /tmp/cert-manager-cluster-issuers.yaml
    mode: "0600"

- name: Apply SelfSigned ClusterIssuer, CA Certificate and CA ClusterIssuer
  ansible.builtin.shell:
    cmd: kubectl apply -f /tmp/cert-manager-cluster-issuers.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for CA Certificate to be ready
  ansible.builtin.command:
    cmd: >
      kubectl wait certificate dpe-ca --namespace cert-manager
      --for=condition=Ready --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
