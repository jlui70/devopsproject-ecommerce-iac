---
- name: Add Argo Helm repository
  ansible.builtin.command:
    cmd: "helm repo add argo https://argoproj.github.io/argo-helm"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: "helm repo update"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Clean Argo Rollouts Helm installation state
  ansible.builtin.shell: |
    NS_STATUS=$(kubectl get namespace argo-rollouts -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
    if [ "$NS_STATUS" = "Terminating" ]; then
      kubectl get namespace argo-rollouts -o json | \
        python3 -c "import sys,json; d=json.load(sys.stdin); d['spec']['finalizers']=[]; print(json.dumps(d))" | \
        kubectl replace --raw /api/v1/namespaces/argo-rollouts/finalize -f - 2>/dev/null || true
      kubectl rollout restart deployment/antrea-controller -n kube-system 2>/dev/null || true
      kubectl wait --for=delete namespace/argo-rollouts --timeout=60s 2>/dev/null || true
    elif [ "$NS_STATUS" = "Active" ]; then
      kubectl get secrets -n argo-rollouts -l "owner=helm,name=argo-rollouts" \
        --no-headers -o custom-columns="NAME:.metadata.name,STATUS:.metadata.labels.status" \
        2>/dev/null | grep -v "deployed" | awk '{print $1}' | \
        xargs -r kubectl delete secret -n argo-rollouts 2>/dev/null || true
    fi
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Install or upgrade Argo Rollouts via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install argo-rollouts argo/argo-rollouts
      --namespace argo-rollouts
      --create-namespace
      --timeout 120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for Argo Rollouts controller to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod
      --namespace argo-rollouts
      --selector=app.kubernetes.io/name=argo-rollouts
      --for=condition=Ready
      --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
