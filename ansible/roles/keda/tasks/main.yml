---
- name: Add KEDA Helm repository
  ansible.builtin.command:
    cmd: "helm repo add kedacore https://kedacore.github.io/charts"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: "helm repo update"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Clean KEDA Helm installation state
  ansible.builtin.shell: |
    NS_STATUS=$(kubectl get namespace keda -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
    if [ "$NS_STATUS" = "Terminating" ]; then
      kubectl get namespace keda -o json | \
        python3 -c "import sys,json; d=json.load(sys.stdin); d['spec']['finalizers']=[]; print(json.dumps(d))" | \
        kubectl replace --raw /api/v1/namespaces/keda/finalize -f - 2>/dev/null || true
      kubectl rollout restart deployment/antrea-controller -n kube-system 2>/dev/null || true
      kubectl wait --for=delete namespace/keda --timeout=60s 2>/dev/null || true
    elif [ "$NS_STATUS" = "Active" ]; then
      kubectl get secrets -n keda -l "owner=helm,name=keda" \
        --no-headers -o custom-columns="NAME:.metadata.name,STATUS:.metadata.labels.status" \
        2>/dev/null | grep -v "deployed" | awk '{print $1}' | \
        xargs -r kubectl delete secret -n keda 2>/dev/null || true
    fi
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Install or upgrade KEDA operator via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install keda kedacore/keda
      --namespace keda
      --create-namespace
      --version {{ keda_chart_version }}
      --timeout 120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true

- name: Wait for KEDA operator pod to be running
  ansible.builtin.command:
    cmd: >
      kubectl wait pod
      --namespace keda
      --selector=app=keda-operator
      --for=condition=Ready
      --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
